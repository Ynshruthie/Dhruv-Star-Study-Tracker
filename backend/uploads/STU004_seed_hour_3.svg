    <text x="180" y="370" font-family="monospace" font-size="15" fill="#1e293b">a) Given vector A = 3i + 4j, find magnitude |A|</text>
    <text x="200" y="400" font-family="monospace" font-size="15" fill="#047857">|A| = √(3² + 4²) = √(9 + 16) = √25 = 5 units</text>
    
